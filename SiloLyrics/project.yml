# Generate the Xcode project on a Mac:  brew install xcodegen && cd SiloLyrics && xcodegen
# Kept separate from AltStore.xcodeproj so the store project is never hand-edited.
name: SiloLyrics
options:
  bundleIdPrefix: com.bigbahar
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  SiloLyricsKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SiloLyrics:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SiloLyricsKit
      - target: LyricsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigbahar.silolyrics
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
  LyricsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: SiloLyricsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigbahar.silolyrics.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
schemes:
  SiloLyrics:
    build:
      targets:
        SiloLyrics: all
    test:
      targets: []
