name: Silo Store Release

# Builds Silo Store, publishes the IPA as a GitHub release, and adds it to the
# source feed on GitHub Pages (https://bigbahar.github.io/silo-store/source.json)
# that installed copies check for updates.

on:
  workflow_dispatch:

concurrency:
  group: silo-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_ID: com.bigbahar.silostore

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
              "$MARKETING_VERSION" "${{ github.run_number }}" "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          # '+commit' is build metadata: keep it in the app, leave it out of the tag
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV
          echo "RELEASE_TAG=v${NORMALIZED_VERSION%%+*}" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Restore Cache
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: silo-build-cache-${{ github.sha }}
          restore-keys: silo-build-cache-

      - name: Build
        run: python3 scripts/ci/workflow.py build

      - name: Save Cache
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: silo-build-cache-${{ github.sha }}

      - name: Create Release
        run: |
          gh release create "$RELEASE_TAG" SideStore.ipa \
            --target "$GITHUB_SHA" \
            --title "Silo Store ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest

      - name: Publish Source Feed
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" pages
          else
            git init -b gh-pages pages
            git -C pages remote add origin "$REMOTE"
          fi

          cp pages/source.json previous-source.json 2>/dev/null || true
          cp silo-source/* pages/
          touch pages/.nojekyll

          python3 scripts/ci/silo_source.py \
            --source pages/source.json \
            --carry-from previous-source.json \
            --ipa SideStore.ipa \
            --bundle-id "$BUNDLE_ID" \
            --version "$MARKETING_VERSION" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SideStore.ipa" \
            --notes "Silo Store ${RELEASE_TAG#v}"

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Silo Store ${RELEASE_TAG#v}"
          git push origin gh-pages

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa
